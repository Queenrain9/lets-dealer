name: Godot project check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run core gameplay smoke test
        run: godot --headless --path . --script res://tests/core_smoke_test.gd

      - name: Run UI card home smoke test
        run: godot --headless --path . --script res://tests/ui_card_home_smoke_test.gd

      - name: Run repeated deal UI smoke test
        run: godot --headless --path . --script res://tests/repeated_deal_ui_smoke_test.gd

      - name: Run chip and pot UI smoke test
        run: godot --headless --path . --script res://tests/chip_pot_ui_smoke_test.gd

      - name: Run forgiving card gesture smoke test
        run: godot --headless --path . --script res://tests/forgiving_card_gesture_smoke_test.gd

      - name: Run native button signal smoke test
        run: godot --headless --path . --script res://tests/real_mouse_input_smoke_test.gd
