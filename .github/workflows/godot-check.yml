name: Godot project check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        shell: bash
        run: |
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/godot-import.log; then
            exit 1
          fi

      - name: Check card-dealing rules
        run: godot --headless --path . --script res://tests/test_deal_round.gd

      - name: Check mouse and touch input
        run: godot --headless --path . --script res://tests/test_table_input.gd

      - name: Check stage 1 dealer management loop
        run: godot --headless --path . --script res://tests/stage1_dealer_management_smoke_test.gd

      - name: Check stage 2 live shift
        run: godot --headless --path . --script res://tests/stage2_live_shift_smoke_test.gd

      - name: Check stage 3 NPC personality
        run: godot --headless --path . --script res://tests/stage3_npc_personality_smoke_test.gd

      - name: Launch main scene
        run: godot --headless --path . --quit-after 2
