name: Godot project check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run core gameplay smoke test
        run: godot --headless --path . --script res://tests/core_smoke_test.gd

      - name: Run input baseline smoke test
        run: godot --headless --path . --script res://tests/input_baseline_smoke_test.gd

      - name: Run dealer vertical slice smoke test
        run: godot --headless --path . --script res://tests/vertical_slice_smoke_test.gd
